<style>
:root{
  --bg:#F3F3F1; --surface:#FFFFFF; --surface-2:#F8F8F6; --ink:#141414; --ink-2:#3F3F3D; --muted:#6F6F6B;
  --line:#E1E1DD; --line-2:#ECECE9;
  --roast:#0A0A0A; --roast-2:#1F1F1F; --roast-ink:#FFFFFF; --roast-muted:#A6A6A2; --logo-red:#BB371A;
  --accent:#008A7C; --accent-ink:#FFFFFF; --accent-soft:#E1F1EE;
  --in:#008A7C; --out:#C27413;
  --pos:#1E7A45; --pos-bg:#E4F2E9; --neg:#B3261E; --neg-bg:#F8E5E2; --warn:#8F5A00; --warn-bg:#F7ECD6; --info:#2E7A50; --info-bg:#E6F4EC;
  --shadow:0 1px 2px rgba(33,28,24,.06),0 8px 24px rgba(33,28,24,.08);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121212; --surface:#1B1B1B; --surface-2:#171717; --ink:#EDEDEB; --ink-2:#CACAC6; --muted:#96968F;
    --line:#303030; --line-2:#262626;
    --roast:#000000; --roast-2:#1E1E1E; --roast-ink:#FFFFFF; --roast-muted:#9E9E99; --logo-red:#D2461F;
    --accent:#20A696; --accent-ink:#0B1A18; --accent-soft:#16302C;
    --in:#20A696; --out:#C77A1E;
    --pos:#62C28A; --pos-bg:#18301F; --neg:#EF8074; --neg-bg:#3A1B18; --warn:#E3AA52; --warn-bg:#35270F; --info:#8CD6AE; --info-bg:#15301F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121212; --surface:#1B1B1B; --surface-2:#171717; --ink:#EDEDEB; --ink-2:#CACAC6; --muted:#96968F;
  --line:#303030; --line-2:#262626;
  --roast:#000000; --roast-2:#1E1E1E; --roast-ink:#FFFFFF; --roast-muted:#9E9E99; --logo-red:#D2461F;
  --accent:#20A696; --accent-ink:#0B1A18; --accent-soft:#16302C;
  --in:#20A696; --out:#C77A1E;
  --pos:#62C28A; --pos-bg:#18301F; --neg:#EF8074; --neg-bg:#3A1B18; --warn:#E3AA52; --warn-bg:#35270F; --info:#8CD6AE; --info-bg:#15301F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* sidebar */
.side{background:var(--roast);color:var(--roast-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start}
.brand{display:flex;flex-direction:column;gap:6px;padding:4px 8px 0;color:#FFFFFF}
.brand .logo-txt{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1;letter-spacing:-.01em;word-break:break-word}
.brand small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--roast-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--roast-muted);font-weight:500}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav button:hover{color:var(--roast-ink);background:var(--roast-2)}
.nav button[aria-current="page"]{color:var(--roast-ink);background:var(--roast-2)}
.nav button[aria-current="page"] svg{stroke:#F0A58F}
.nav button[aria-current="page"]{box-shadow:inset 3px 0 0 var(--logo-red)}
.nav button:focus-visible{outline:2px solid var(--in);outline-offset:1px}
.nav .badge{margin-left:auto;background:var(--logo-red);color:#fff;border-radius:999px;font-size:11px;font-weight:600;padding:0 7px;line-height:18px}
.nav .sep{height:1px;background:var(--roast-2);margin:8px 4px}
.side .conn{margin-top:auto;font-size:12px;color:var(--roast-muted);padding:0 8px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--roast-muted);flex:none}
.dot.on{background:#3FC29B}.dot.off{background:#E0A64A}
/* main */
main{padding-block:28px 64px;padding-inline:32px;min-width:0}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted)}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.icon-btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card-c:focus-visible,.cal-day:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.pri{background:var(--roast);border-color:var(--roast);color:var(--roast-ink)}
:root[data-theme="dark"] .btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:4px 6px;border-radius:6px;color:var(--muted)}
.icon-btn:hover{background:var(--line-2);color:var(--ink)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-weight:500}
.banner.info{background:var(--info-bg);color:var(--info)}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:17px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em}
.panel h2 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.6fr 1fr}
.g2e{grid-template-columns:1fr 1fr}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.kpi .val{font-family:var(--f-mono);font-size:22px;font-weight:500;letter-spacing:-.02em}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:var(--roast);border-color:var(--roast-2);color:var(--roast-ink)}
.kpi.hero .lbl,.kpi.hero .sub{color:var(--roast-muted)}
.neg{color:var(--neg)}.pos{color:var(--pos)}
/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
input[type=text],input[type=date],input[type=month],input[type=time],input[type=number],input[type=email],input[type=tel],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.toolbar select,.toolbar input{width:auto}
textarea{resize:vertical;min-height:70px}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;background:var(--surface-2);white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
td.r,th.r{text-align:right}
td .desc{font-weight:500}
td .meta{font-size:12px;color:var(--muted)}
tfoot td{font-weight:600;background:var(--surface-2)}
.dre td{padding:7px 12px}
.dre tr.grp td{font-weight:600}
.dre tr.sub td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.dre tr.tot td{font-weight:700;background:var(--roast);color:var(--roast-ink)}
.dre tr.cat td:first-child{padding-left:28px;color:var(--ink-2)}
.dre td:first-child{white-space:nowrap}
.dre td.pct{color:var(--muted);font-size:12px}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pago{background:var(--pos-bg);color:var(--pos)}
.st-vencido{background:var(--neg-bg);color:var(--neg)}
.st-vence{background:var(--warn-bg);color:var(--warn)}
.st-aberto{background:var(--line-2);color:var(--ink-2)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;background:var(--line-2);color:var(--ink-2);font-weight:500}
.tag.ex{background:var(--info-bg);color:var(--info)}
.tipo-r{color:var(--in);font-weight:600}.tipo-d{color:var(--out);font-weight:600}
.arrow{font-family:var(--f-mono);font-weight:500}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.li:last-child{border-bottom:0}
.li .d{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:46px;text-align:center;line-height:1.15}
.li .d b{display:block;font-size:17px;color:var(--ink);font-weight:500}
.empty{color:var(--muted);padding:18px 0;text-align:center}
/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:9px 11px;border-radius:8px;font-size:12px;box-shadow:var(--shadow);z-index:5;min-width:190px}
.tip b{display:block;margin-bottom:4px;font-family:var(--f-body)}
.tip div{display:flex;justify-content:space-between;gap:14px;font-family:var(--f-mono)}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col h3{margin:2px 4px 4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between}
.card-c{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 11px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.card-c:hover{border-color:var(--muted)}
.card-c .n{font-weight:600}
.card-c .m{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.cal .wd{padding:8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:600}
.cal-day{min-height:96px;padding:6px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);cursor:pointer;display:flex;flex-direction:column;gap:3px;background:var(--surface);border-top:0;border-left:0;text-align:left}
.cal-day:nth-child(7n){border-right:0}
.cal-day.out{background:var(--surface-2);color:var(--muted)}
.cal-day.today .dn{background:var(--roast);color:var(--roast-ink);border-radius:6px;padding:0 6px}
.cal-day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.dn{font-family:var(--f-mono);font-size:12px;align-self:flex-start}
.ev{font-size:11.5px;padding:2px 5px;border-radius:4px;background:var(--accent-soft);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--accent)}
.ev.done{opacity:.55;text-decoration:line-through}
.ev-more{font-size:11px;color:var(--muted)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,15,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:20;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:560px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 6vh - 24px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.modal.wide{max-width:820px}
.modal h2{font-family:var(--f-display);margin:0;font-size:21px;letter-spacing:-.01em}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.modal .foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.modal .foot > div{display:flex;gap:8px;flex-wrap:wrap}
.err{color:var(--neg);font-size:13px;font-weight:500}
.hist{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto}
.hist .h{border-left:2px solid var(--line);padding-left:10px}
.hist .h small{color:var(--muted);font-family:var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:500;z-index:30;box-shadow:var(--shadow)}
.stats-row{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:6px}
.stats-row div{display:flex;flex-direction:column}
.stats-row small{color:var(--muted);font-size:12px}
.stats-row b{font-family:var(--f-mono);font-weight:500;font-size:16px}
.bar-h{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.bar-h i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cfg-list .li{grid-template-columns:1fr auto auto}
.note{font-size:12.5px;color:var(--muted)}
.mp-sel{display:flex;align-items:center;justify-content:space-between;gap:10px}.mp-sel b{font-size:15px}
.mpick{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.mp-y{display:flex;align-items:center;gap:8px;margin-bottom:6px}.mp-y b{font-family:var(--f-mono);min-width:44px;text-align:center}
.mp-m{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.mp-m button,.ms{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 4px;cursor:pointer;font-size:13px;text-transform:capitalize;color:var(--ink-2)}
.mp-m button.hoje,.ms.hoje{border-color:var(--muted)}
.mp-m button[aria-pressed="true"],.ms.on{background:var(--brand);color:#000;border:2px solid #000;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.25);transform:translateY(-1px)}
.ms.hoje:not(.on){position:relative}.ms.hoje:not(.on)::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--brand)}
.mstrip{margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.ms-row{display:flex;gap:4px;align-items:center;overflow-x:auto;padding-bottom:2px}
.ms{padding:6px 10px;white-space:nowrap;font-family:var(--f-mono);font-size:12.5px;text-transform:none}
.parte-row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}.parte-row .seg{flex:none}
.ac{position:relative;flex:1;min-width:200px}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:40;max-height:260px;overflow-y:auto;padding:4px}
.ac-item{padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column}
.ac-item span{font-size:12px;color:var(--muted)}
.ac-item.on,.ac-item:hover{background:var(--accent-soft)}
.ac-novo{border-top:1px solid var(--line-2);margin-top:2px}.ac-novo b{color:var(--accent)}
.novo-parte{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.ac-empty{padding:10px;color:var(--muted);font-size:13px}
.parc-prev{border:1px solid var(--line);border-radius:10px;padding:2px 12px;max-height:220px;overflow-y:auto}

function dreCalc(ini,fim,regime,cc){

  }

function fatPer(p,cc){

    const fat=serie.reduce((a,x)=>a+x.v,0); const ai=addMonths(p.ini,-n), af=addMonths(p.ini,-1); let ant=0; for(let i=0;i<n;i++) ant+=fatMes(addMonths(ai,i),cc);

function finPer(p,cc){

function filtraContas(tipo){
  const f=ui.c;

    if(l.tipo!==tipo) return false;

    if(f.status==="abertos"&&l.pago) return false;
    if(f.status==="pagos"&&!l.pago) return false;
    if(f.status==="vencidos"&&statusOf(l)!=="vencido") return false;

    if(f.q){ const q=normTxt(f.q); if(!normTxt([l.descricao,fornNome(fornBy(l.fornecedorId)),fornBy(l.fornecedorId)?.codigo,catBy(l.categoria)?.nome,l.numero].join(" ")).includes(q)) return false; }

async function moverSemLoja(btn){
  const dest=($("#slDest")||{}).value; if(!dest){ toast("Escolha a loja de destino."); return; }
  const x=semLoja(); const total=x.lanc.length+x.rec.length; let feitos=0; btn.disabled=true;

function valorExtenso(c){ const r=Math.floor(c/100), cs=c%100;

  const ate999=n=>{ if(n===100) return "cem"; const p=[]; if(n>=100){ p.push(h[Math.floor(n/100)]); n%=100; } if(n>=20){ p.push(d[Math.floor(n/10)]+(n%10?" e "+u[n%10]:"")); } else if(n>0||!p.length) p.push(u[n]); return p.join(" e "); };
  const mil=Math.floor(r/1000), resto=r%1000; let t=(mil?(mil===1?"mil":ate999(mil)+" mil")+(resto?(resto<100||resto%100===0?" e ":" ")+ate999(resto):""):ate999(resto))+(r===1?" real":" reais");
  if(cs) t+=" e "+ate999(cs)+(cs===1?" centavo":" centavos"); return t; }

const LIB_PDFLIB="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js";
async function manualBytes(){
  const {data,error}=await FB.sb.rpc("manual_baixar"); if(error) throw error;
  const bin=atob(data.conteudo); let u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  try{
    await loadLib(LIB_PDFLIB,()=>window.PDFLib&&window.PDFLib.PDFDocument);
    const {PDFDocument,StandardFonts,rgb,degrees}=window.PDFLib; const doc=await PDFDocument.load(u8); const f=await doc.embedFont(StandardFonts.Helvetica);
    const quem=(S.me&&S.me.name)||"usuário", docu=(S.conta&&S.conta.login)?fmtDoc(S.conta.login):"", quando=new Date().toLocaleString("pt-BR");
    const sem=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"");   // fonte padrão do PDF não tem acentos
    const linha=sem(`Copia de ${quem}${docu?" - "+docu:""} - baixada em ${quando} - uso exclusivo, proibida a reproducao, divulgacao ou uso em IA`);
    doc.getPages().forEach(pg=>{ const {width}=pg.getSize(); pg.drawText(linha,{x:30,y:8,size:6.5,font:f,color:rgb(.75,.2,.15)});
      pg.drawText(sem(`Copia de ${quem}`),{x:width/2-120,y:420,size:28,font:f,color:rgb(.85,.85,.85),opacity:.18,rotate:degrees(35)}); });
    doc.setSubject(sem(`Copia identificada de ${quem}${docu?" ("+docu+")":""}, baixada em ${quando}. Documento confidencial.`));
    u8=await doc.save();
  }catch(e){ console.warn("carimbo do manual não aplicado",e); }
  return {bytes:u8,nome:data.nome||"Manual-do-Usuario-Fluxxu.pdf"};
}

const bissexto = y => (y%4===0&&y%100!==0)||y%400===0;
function anivDoDia(ds,cc){
  const md=ds.slice(5), y=+ds.slice(0,4); const out=[];
  const bate=d=>{ if(!d||d.length<10) return false; let m=d.slice(5,10); if(m==="02-29"&&!bissexto(y)) m="02-28"; return m===md && +d.slice(0,4)<=y; };
  for(const l of S.lojas) if(bate(l.inauguracao)&&ccOk(l.id,cc)){ const n=y-+l.inauguracao.slice(0,4); out.push({tipo:"loja",lojaId:l.id,data:ds,titulo:n?`Aniversário da loja ${lojaNome(l)} — ${n} ano${n>1?"s":""}`:`Inauguração da loja ${lojaNome(l)}`,curto:n?`${n} ano${n>1?"s":""}: ${lojaNome(l)}`:`Inauguração: ${lojaNome(l)}`}); }
  for(const u of S.usr) if(bate(u.nascimento)){ const nm=nomeUsr(u.id); out.push({tipo:"usr",data:ds,titulo:`Aniversário de ${nm}`,curto:nm}); }
  return out;
}

    const lista=only?[only]:S.rec.filter(x=>x.ativa);
    for(const rc of lista){
      const lim = rc.variavel ? addMonths(mkey(HOJE),1) : ate;
      const fim = rc.fim && rc.fim<lim ? rc.fim : lim;
      for(let k=rc.inicio, i=0; k<=fim && i<120; k=addMonths(k,1), i++){
        if((rc.pulados||[]).includes(k)) continue;
        const id=`rec-${rc.id}-${k}`;
        if(S.lanc.some(x=>x.id===id)) continue;
        const [yy,mm]=k.split("-").map(Number); const ult=new Date(yy,mm,0).getDate();
        const venc=rc.vencInicio ? addMonthsDate(rc.vencInicio,i) : k+"-"+pad(Math.min(rc.dia||1,ult));
        const d={tipo:rc.tipo,descricao:rc.descricao,valor:rc.valor||0,venc,dataLanc:venc,competencia:k,pago:null,categoria:rc.categoria,centro:rc.centro||"",forma:rc.forma||"",fornecedorId:rc.fornecedorId||null,obs:rc.obs||"",recId:rc.id,recTipo:rc.variavel?"variavel":"fixa",valorPendente:!!rc.variavel,parcela:"mensal",numero:rc.numero||null,criadoPor:rc.criadoPor||null,criado:new Date().toISOString()};
        await save("lanc",id,d);
        if(!S.lanc.some(x=>x.id===id)) S.lanc.push({...d,id});
      }
    }
  }catch(e){} finally{ recBusy=false; }
}
async function encerrarRec(rc,ultimoMes){
  try{
    await save("rec",rc.id,{...rc,ativa:false,fim:ultimoMes,encerradaEm:new Date().toISOString()});
    const futuros=S.lanc.filter(l=>l.recId===rc.id&&!l.pago&&compOf(l)>ultimoMes);
    for(const l of futuros) await del("lanc",l.id);
    toast(`Recorrência encerrada — último mês ${mlabel(ultimoMes)}`);
  }catch(e){}
}

let modalOpen=false;
function openModal(html,wide,onMount,opOk){
  const root=$("#modalRoot");
  root.innerHTML=`<div class="scrim" data-scrim><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  modalOpen=true;
  const first=root.querySelector("input:not([type=hidden]),select,textarea"); if(first) first.focus();
  const m=root.querySelector(".modal");
  m.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeModal));
  if(onMount) onMount(m);
  if(opOk!=="all" && (S.role==="ro" || (!isAdm() && !opOk))) somenteLeitura(m);
}
function somenteLeitura(m){
  if(!m) return;
  m.querySelectorAll("input,select,textarea").forEach(e=>e.disabled=true);
  m.querySelectorAll("button").forEach(b=>{ if(b.hasAttribute("data-close")) return; b.hidden=true; });
  const h=m.querySelector("h2"); if(h) h.insertAdjacentHTML("afterend",`<div class="banner info" style="margin:0">${S.role==="ro"?(masterRede()?"Somente leitura — solicite autorização ao franqueado para editar.":"Modo observador — somente leitura."):"Perfil Operador — somente visualização."}</div>`);
}
function closeModal(){ $("#modalRoot").innerHTML=""; modalOpen=false; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&modalOpen) closeModal(); });
$("#modalRoot").addEventListener("mousedown",e=>{ if(e.target.hasAttribute("data-scrim")) closeModal(); });
function confirmBtn(btn,label,fn){
  if(btn.dataset.armed){ fn(); return; }
  btn.dataset.armed="1"; const old=btn.innerHTML; btn.textContent=label;
  setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.innerHTML=old; } },4000);
}

async function criarForn(dados){

function buscarForn(q){
  const n=normTxt(q.trim()), dg=digitos(q);
  const all=[...S.forn].sort((a,b)=>fornNome(a).localeCompare(fornNome(b)));
  if(!n) return all.slice(0,8);
  const hit=f=>normTxt([f.codigo,fornNome(f),fornResp(f)].join(" ")).includes(n)||(dg.length>=3&&digitos(f.documento).startsWith(dg));
  const ini=all.filter(f=>normTxt(fornNome(f)).startsWith(n)||normTxt(f.codigo).startsWith(n));
  return [...ini,...all.filter(f=>!ini.includes(f)&&hit(f))].slice(0,8);
}

function histEm(item,m){ let r={valor:item&&item.valor,dia:item&&item.dia}; for(const e of [...((item&&item.hist)||[])].sort((a,b)=>a.desde.localeCompare(b.desde))){ if(e.desde<=m) r={valor:e.valor,dia:e.dia}; } return r; }

async function aplicarEscopoAuto(l,sc,valor,venc,forma){
  const lj=lojaBy(l.centro); if(!lj||!lj.auto) return; const key=l.auto==="mensalidade"?"mens":"ener"; const item={...(lj.auto[key]||{})}; const k=l.competencia;

  if(sc==="all"){ item.valor=valor; item.dia=dia; item.hist=[]; }
  else { const h=(item.hist||[]).filter(x=>x.desde<k); h.push({desde:k,valor,dia}); item.hist=h; }
  await save("lojas",lj.id,{...lj,auto:{...lj.auto,[key]:item}});

    if(autoManual(x)||x.forma!==forma||(x.autoVenc&&x.venc!==x.autoVenc)) await save("lanc",x.id,{...x,autoValor:x.valor,forma,venc:x.autoVenc||x.venc}); } }

  closeModal(); toast(sc==="all"?"Alterado em todos os meses em aberto":`Alterado de ${mlabel(k)} em diante`); agendarAuto();

function calcAuto(l){ // quanto o cálculo automático daria para este lançamento
  const lj=lojaBy(l.centro); const a=lj&&lj.auto; if(!a) return null; const m=l.competencia;
  const b=S.lanc.filter(x=>!x.auto&&x.tipo==="receita"&&x.centro===lj.id&&(VENDAS_AUTO.includes(x.categoria)||modalDe(x.categoria))&&compOf(x)===m).reduce((s,x)=>s+x.valor,0);
  if(l.auto==="mensalidade") return (a.mens&&a.mens.on)?histEm(a.mens,m).valor:0;
  if(l.auto==="energia") return (a.ener&&a.ener.tipo==="fixa")?histEm(a.ener,m).valor:0;
  if(l.auto==="royalty") return (a.roy&&a.roy.on!==false)?Math.round(b*(+a.roy.pct||0)/100):0;

function pctCashback(cb,base){ if(!cb||cb.tipo==="nao") return 0; if(cb.tipo==="fixo") return +cb.pct||0;

let autoBusy=false, autoT=null;

async function sincAuto(){

  if(nivel("lanc")<2) return; if(S.claims.papel==="master_rede"&&!S.liberado) return; if(S.claims.papel==="observador") return;

    const desejo={}; const chave=(t,lj,m)=>`auto_${S.tid}_${t}_${lj}_${m.replace("-","")}`; const cur=mkey(HOJE);
    for(const lj of S.lojas){ const a=lj.auto; if(!a) continue; const desde=a.desde||cur;
      // royalties e cashback: pelas vendas do mês
      const base={}; S.lanc.forEach(l=>{ if(l.auto||l.tipo!=="receita"||l.centro!==lj.id||!(VENDAS_AUTO.includes(l.categoria)||modalDe(l.categoria))) return; const m=compOf(l); if(m&&m>=desde) base[m]=(base[m]||0)+l.valor; });
      for(const [m,b] of Object.entries(base)){ if(!b) continue;
        const venc=proxDiaUtil(`${addMonths(m,1)}-${pad(Math.min(28,a.dia||7))}`);
        if(a.roy&&a.roy.on!==false&&+a.roy.pct>0){ const v=Math.round(b*a.roy.pct/100), pc=+a.roy.pct; if(v>0) desejo[chave("roy",lj.id,m)]={auto:"royalty",lj,m,v,venc,cat:"cop_royalties",forma:"Boleto",desc:`Royalties ${pctTxt(pc)}% — ${mlabel(m)}`,obs:`Calculado automaticamente: ${pctTxt(pc)}% sobre vendas de ${fmt(b)} (${cenNome(lj.id)}, ${mlabel(m)}).`,base:b,pct:pc}; }
        const pc=pctCashback(a.cb,b); if(pc>0){ const v=Math.round(b*pc/100); if(v>0) desejo[chave("cb",lj.id,m)]={auto:"cashback",lj,m,v,venc,cat:"cop_cashback",forma:"Transferência",desc:`Cashback ao condomínio ${pctTxt(pc)}% — ${mlabel(m)}`,obs:`Calculado automaticamente: ${pctTxt(pc)}% sobre vendas de ${fmt(b)} (${cenNome(lj.id)}, ${mlabel(m)}).`,base:b,pct:pc}; }
      }

          if(a.ener&&a.ener.tipo==="fixa"&&he.valor>0) desejo[chave("ener",lj.id,m)]={auto:"energia",lj,m,v:he.valor,venc:proxDiaUtil(`${m}-${pad(he.dia||15)}`),cat:"cop_energia",forma:"Boleto",desc:`Energia — ${mlabel(m)}`,obs:`Energia fixa configurada na loja (${fmt(he.valor)}/mês).`};
          if(a.ener&&a.ener.tipo==="var") desejo[chave("ener",lj.id,m)]={auto:"energia",lj,m,v:0,pend:true,venc:proxDiaUtil(`${m}-${pad(a.ener.dia||15)}`),cat:"cop_energia",forma:"Boleto",desc:`Energia — ${mlabel(m)}`,obs:`Energia variável: digite o valor da conta deste mês.`};

      const vencFinal = ex&&ex.autoVenc&&ex.venc&&ex.venc!==ex.autoVenc ? ex.venc : w.venc;   // vencimento trocado à mão: mantém
      if(ex&&ex.valor===w.v&&ex.autoValor===w.v&&ex.descricao===w.desc&&ex.centro===w.lj.id&&ex.venc===vencFinal&&ex.autoVenc===w.venc&&!!ex.valorPendente===!!w.pend) continue;
      const doc={...(ex||{}),tipo:"despesa",descricao:w.desc,valor:w.v,categoria:w.cat,centro:w.lj.id,competencia:w.m,dataLanc:ultimoDia(+w.m.slice(0,4),+w.m.slice(5)),venc:vencFinal,autoValor:w.v,autoVenc:w.venc,
        pago:null,forma:ex&&ex.forma?ex.forma:w.forma,fornecedorId:ex?ex.fornecedorId||null:null,obs:w.obs,valorPendente:!!w.pend,
        auto:w.auto,autoBase:w.base??null,autoPct:w.pct??null,numero:ex?ex.numero:numero++,parcela:"",criadoPor:ex?ex.criadoPor:"automatico",criado:ex?ex.criado:new Date().toISOString()};
      delete doc.id; await col.doc(id).set(doc); mud++;

  const per=`${mlabel(ui.d.ini)} a ${mlabel(ui.d.fim)}`;
  const K=await pdfNovo(true,"DRE financeiro",`${per} · regime de ${ui.d.regime==="caixa"?"caixa (valores pagos e recebidos)":"competência (mês da data do lançamento)"} · investimentos fora do resultado`);
  const {doc,M,CW}=K;
  pdfCards(K,[
    {lbl:"Receita bruta",val:fmt(t.receita),sub:per,cor:[14,138,79]},
    {lbl:"Receita líquida",val:fmt(RL),sub:`deduções ${fmt0(-t.deducao)}`},
    {lbl:"Lucro bruto",val:fmt(t.LB),sub:`margem bruta ${pct(t.LB,RL)}`,cor:t.LB<0?PC.neg:null},
    {lbl:"Resultado operacional",val:fmt(t.RO),sub:`margem operacional ${pct(t.RO,RL)}`,cor:t.RO<0?PC.neg:null},
    {lbl:"Resultado líquido",val:fmt(t.RLIQ),sub:`margem líquida ${pct(t.RLIQ,RL)}`,hero:true,cor:t.RLIQ<0?[255,160,150]:null}
  ]);
  const wl=CW*0.5-4, wr=CW-wl-8, y0=K.y+2;
  const rhC=Math.min(12,Math.max(6.6,(K.H-15-6-(y0+6))/9)), bhC=Math.min(6,rhC*0.46);
  pdfSecAt(K,M,y0,"Composição do resultado");
  const comp=[["Receita bruta",t.receita,PC.blue],["Deduções e impostos",t.deducao,PC.grayL],["CMV",t.cmv,[120,126,132]],["Custos operacionais",t.custop,PC.grayL],["Despesas operacionais",t.despop,PC.grayL],["Despesas administrativas",t.adm,PC.grayL],["Pessoal",t.pessoal,PC.grayL],["Resultado financeiro",t.financeiro,PC.grayL],["Resultado líquido",t.RLIQ,t.RLIQ<0?PC.neg:[0,0,0]]];
  pdfBarrasH(K,comp.map(([l,v,c],i)=>({lbl:l,v,cor:c,bold:i===0||i===comp.length-1})),M,y0+6,wl,{lw:40,vw:28,rh:rhC,bh:bhC});
  const geral=!cc||cc==="lojas";
  if(geral){
    pdfSecAt(K,M+wl+8,y0,"Resultado por centro de custo");
    const cens=centros().filter(c=>cc!=="lojas"||c.id!=="matriz").map(c=>{ const x=d.byCen[c.id]||{rec:0,gas:0}; return {lbl:c.nome,v:x.rec-x.gas,x}; });
    pdfBarrasH(K,cens.slice(0,8).map(c=>({lbl:c.lbl,v:c.v,cor:c.v<0?PC.neg:PC.blue})),M+wl+8,y0+6,wr,{lw:42,vw:44,rh:rhC,bh:bhC,fmtV:(v,it)=>`${fmt(v)}  ${cens.find(c=>c.lbl===it.lbl).x.rec?"("+pct(v,cens.find(c=>c.lbl===it.lbl).x.rec)+")":""}`});
  } else {
    pdfSecAt(K,M+wl+8,y0,"Margens sobre a receita líquida");
    const mg=[["Margem bruta",t.LB],["Margem operacional",t.RO],["Margem líquida",t.RLIQ],["CMV",-t.cmv],["Custos e despesas",-(t.custop+t.despop+t.adm+t.pessoal)]];
    pdfBarrasH(K,mg.map(([l,v],i)=>({lbl:l,v:RL?Math.round(v/RL*1000):0,cor:i<3?(v<0?PC.neg:PC.blue):PC.grayL,bold:i===2})),M+wl+8,y0+6,wr,{lw:42,vw:20,rh:rhC,bh:bhC,fmtV:v=>(v/10).toLocaleString("pt-BR",{maximumFractionDigits:1})+"%"});
  }
  K.y=y0+6+9*rhC+8;
  const rep=reportData("dre");
  const tabH=7+rep.rows.length*6.2+12; if(K.y+tabH>K.H-15){ K.doc.addPage(); pdfCab(K,false); }
  pdfSec(K,"Demonstrativo detalhado","por mês e por categoria · resultados negativos em vermelho");
  pdfTabela(K,rep.cols,rep.rows,{rh:6.2,negSo:["sub","tot"]});
  pdfRodape(K);
  return {blob:doc.output("blob"),file:pdfArquivo("dre")};
}

async function gerarXlsx(rep){
  await loadLib(LIB_XLSX,()=>window.XLSX&&window.XLSX.utils);
  const X=window.XLSX;
  const aoa=[[rep.title],[rep.sub],[`Gerado em ${new Date().toLocaleString("pt-BR")}${S.me&&S.me.name?" por "+S.me.name:""}`],[],rep.cols.map(c=>c.h)];
  const money=[];
  rep.rows.forEach(r=>{ const ri=aoa.length; aoa.push(r.c.map((v,ci)=>{ if(v&&typeof v==="object"){ money.push([ri,ci]); return (v.m||0)/100; } return v==null?"":v; })); });
  const ws=X.utils.aoa_to_sheet(aoa);
  money.forEach(([r,c])=>{ const a=X.utils.encode_cell({r,c}); if(ws[a]) ws[a].z='"R$" #,##0.00;[Red]-"R$" #,##0.00'; });
  ws["!cols"]=rep.cols.map((c,i)=>({wch:i===0&&!c.h?26:Math.max(9,Math.round(c.w*1.25))}));
  const wb=X.utils.book_new(); X.utils.book_append_sheet(wb,ws,(rep.sheet||"Relatório").slice(0,31));
  const buf=X.write(wb,{bookType:"xlsx",type:"array"});
  return new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
async function relatorio(k,formato,btn){
  if(!S.dl){ toast("Download indisponível nesta visualização."); return; }
  const custom={dash:pdfDashboard,fluxo:pdfFluxo,dre:pdfDre}[k];
  const rep=(formato==="pdf"&&custom)?null:reportData(k); if(!rep&&!(formato==="pdf"&&custom)) return;
  const old=btn?btn.innerHTML:""; if(btn){ btn.disabled=true; btn.textContent="Gerando…"; }
  try{
    let blob,file;
    if(formato==="pdf"&&custom){ const r=await custom(); blob=r.blob; file=r.file; }
    else { blob = formato==="pdf" ? await gerarPdf(rep) : await gerarXlsx(rep); file=rep.file; }
    await S.dl.save({filename:file+(formato==="pdf"?".pdf":".xlsx"),data:blob});
  }catch(e){
    const c=e&&e.code;
    if(c==="declined"||c==="cancelled"){}
    else if(c==="rate_limited") toast("Já existe um download aguardando confirmação.");
    else if(c==="extension_not_enabled") toast("Esse formato de arquivo não está disponível nesta visualização.");
    else toast("Não foi possível gerar o arquivo. Tente de novo.");
  }finally{ if(btn&&btn.isConnected){ btn.disabled=false; btn.innerHTML=old; } }
}

function sbErro(e){ const x=new Error(msgErro(e)); x.code=(e&&(e.code==="42501"||/row-level security|permission denied/i.test(e.message||"")))?"permission-denied":(e&&e.code); return x; }
async function buscar(tab,f){
  const out=[]; let de=0; const lote=1000;
  for(;;){
    let q=FB.sb.from(tab).select(f.cols||"id,tid,data");
    if(f.tid) q=q.eq("tid",f.tid); if(f.id) q=q.eq("id",f.id); (f.eq||[]).forEach(([c,v])=>{ q=q.eq(c,v); });
    if(f.ordem) q=q.order(f.ordem[0],{ascending:f.ordem[1]});
    const n=f.limite?Math.min(f.limite-out.length,lote):lote; q=q.range(de,de+n-1);
    const {data,error}=await q; if(error) throw sbErro(error);
    out.push(...data); if(data.length<n||(f.limite&&out.length>=f.limite)) break; de+=n;
  }
  return out;
}
const VIGIAS=new Set();
// depois de gravar, recarrega na hora o que mudou (o tempo real do Supabase complementa)
function atualizarTabelas(...tabs){ VIGIAS.forEach(v=>{ if(tabs.includes(v.tab)) v.agendar(); }); }
function vigiar(tab,f,cb,filtro){
  let vivo=true, t=null;
  const carregar=async()=>{ try{ const rows=await buscar(tab,f); if(vivo) cb(rows); }catch(e){ console.warn("dados",tab,e.message); } };
  const agendar=()=>{ clearTimeout(t); t=setTimeout(carregar,250); };
  const reg={tab,agendar}; VIGIAS.add(reg);
  const ch=FB.sb.channel("rt"+(++chN)+"-"+tab); const flt=filtro?{filter:filtro}:{};
  ch.on("postgres_changes",{event:"INSERT",schema:"public",table:tab,...flt},agendar)
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:tab,...flt},agendar)
    .on("postgres_changes",{event:"DELETE",schema:"public",table:tab},agendar).subscribe();
  carregar();
  return ()=>{ vivo=false; clearTimeout(t); VIGIAS.delete(reg); try{ FB.sb.removeChannel(ch); }catch(e){} };
}
const novoId = () => (window.crypto&&crypto.randomUUID?crypto.randomUUID().replace(/-/g,""):rid()+rid()).slice(0,20);

function colecaoTenant(tab,tid,o){
  o=o||{};
  return {
    doc:id=>{ id=id||novoId(); return {id,
      set:async d=>{ const {error}=await FB.sb.from(tab).upsert({id,tid,data:d}); if(error) throw sbErro(error); atualizarTabelas(tab,"tenants"); },
      delete:async()=>{ const {error}=await FB.sb.from(tab).delete().eq("id",id); if(error) throw sbErro(error); atualizarTabelas(tab,"tenants"); },
      update:async p=>{ const {data:r,error:e1}=await FB.sb.from(tab).select("data").eq("id",id).maybeSingle(); if(e1) throw sbErro(e1);
        const {error}=await FB.sb.from(tab).update({data:{...((r&&r.data)||{}),...p}}).eq("id",id); if(error) throw sbErro(error); atualizarTabelas(tab); } }; },
    orderBy:(campo,dir)=>colecaoTenant(tab,tid,{...o,ordem:["data->>"+campo,dir!=="desc"]}),
    limit:n=>colecaoTenant(tab,tid,{...o,limite:n}),
    onSnapshot:cb=>vigiar(tab,{tid,...o},rows=>cb(snapDe(rows)),"tid=eq."+tid)
  };
}

  if(masterRede()){

  if(ehBpo()||masterRede()) UNSUB_REDE.push(vigiar("contratos_bpo",{cols:"id,tid,data",ordem:["criado",false],limite:300},rows=>{ const novo=rows.map(r=>({...r.data,id:r.id,tid:r.tid})); const sig=JSON.stringify(novo); if(sig===S._ctrSig) return; S._ctrSig=sig; S.ctrRede=novo; if(!S.tid) render(); else renderNav(); }));
  UNSUB_REDE.push(vigiar("envios",{cols:"id,tid,data",ordem:["criado",false],limite:800},rows=>{ const novo=rows.map(r=>({...r.data,id:r.id,tid:r.tid})); const sig=JSON.stringify(novo); if(sig===S._envSig) return; S._envSig=sig; S.envRede=novo; if(!S.tid) render(); else renderNav(); }));

function abrirTenant(tid){
  if(tid) fecharChat();
  pararTenant(); limparDados(); S.tid=tid||null;
  if(!tid){ S.db=null; ui.view=masterRede()?"painelrede":"rede"; computeRole(); render(); window.scrollTo(0,0); return; }
  S.db={collection:n=>colecaoTenant(n,tid),doc:p=>p==="config/main"?configTenant(tid):null};
  if(plat()){
    try{ localStorage.setItem("mm-tenant",tid); }catch(e){}
    ui.view="painel";
    const t=S.tenants.find(x=>x.id===tid); const nm=t?(t.matriz&&t.matriz.razao)||t.nome:tid;
    diario(masterRede()?"Acesso da franqueadora":"Acesso de observador",`${S.me.name} (${PAPEIS[S.claims.papel]}) entrou na conta`,{cat:"acesso"});
    diarioRede("Entrou em franqueado",nm);
  }
  const sub=(ref,fn)=>UNSUB.push(ref.onSnapshot(fn,e=>console.warn(e)));
  UNSUB.push(vigiar("tenants",{cols:"id,data",id:tid},rows=>{ S.tenant=rows[0]?{...rows[0].data,id:rows[0].id}:null; computeRole(); render(); },"id=eq."+tid));
  sub(S.db.doc("config/main"),s=>{ S.cfg=s.exists?s.data():null; S.cfgLoaded=true; render(); });
  sub(S.db.collection(COL.div),s=>{ S.div=s.docs.map(strip); S.loaded.div=true; if(ui.view==="cmv") render(); });
  sub(S.db.collection(COL.lanc),s=>{ S.lanc=s.docs.map(strip); S.loaded.lanc=true; render(); agendarRec(); agendarAuto(); });
  sub(S.db.collection(COL.rec),s=>{ S.rec=s.docs.map(strip); S.loaded.rec=true; render(); agendarRec(); });
  sub(S.db.collection(COL.forn),s=>{ S.forn=s.docs.map(strip); S.loaded.forn=true; render(); agendarCodigos(); });
  sub(S.db.collection(COL.ag),s=>{ S.ag=s.docs.map(strip); render(); });
  sub(S.db.collection(COL.lojas),s=>{ S.lojas=s.docs.map(strip); render(); agendarAuto(); });
  sub(S.db.collection(COL.usr),s=>{ S.usr=s.docs.map(strip); S.names={}; S.usr.forEach(u=>S.names[u.id]=u.nome||u.email||""); if(S.me) S.names[S.me.id]=S.names[S.me.id]||S.me.name; render(); });
  if(gestorFranq()||plat()||(S.tenant&&S.tenant.bpoUid)){
    sub(S.db.collection("contratos_bpo").orderBy("propostoEm","desc").limit(50),s=>{ const novo=s.docs.map(strip); const sig=JSON.stringify(novo); if(sig===S._ctrSigT) return; S._ctrSigT=sig; S.ctr=novo; render(); });
    sub(S.db.collection("envios").orderBy("enviadoEm","desc").limit(500),s=>{ const novo=s.docs.map(strip); const sig=JSON.stringify(novo); if(sig===S._envSigT) return; S._envSigT=sig; S.envios=novo; render(); });
    sub(S.db.collection("chamados").orderBy("abertoEm","desc").limit(300),s=>{ const novo=s.docs.map(strip); const sig=JSON.stringify(novo); if(sig===S._chSigT) return; S._chSigT=sig; S.cham=novo; render(); });
    sub(S.db.collection("mensagens").orderBy("quando","desc").limit(1500),s=>{ const novo=s.docs.map(strip).reverse(); const mudou=novo.length!==S.msgs.length||(novo.length&&novo[novo.length-1].id!==S.msgs[S.msgs.length-1].id); S.msgs=novo; if(mudou&&ui.view==="chamados") render(); });
    sub(S.db.collection("diario").orderBy("quando","desc").limit(500),s=>{ S.diario=s.docs.map(strip); if(ui.view==="diario") render(); });
  }
  computeRole(); render();
}
function computeRole(){
  const p=S.claims.papel; const am=S.tenant&&S.tenant.acessoMaster;
  S.liberado = p==="master_rede" && !!am && tsMs(am.ate)>Date.now();
  const mod=VIEW_MOD[ui.view];
  const n = S.forcarLeitura ? 1 : mod ? nivel(mod) : ((p==="master"&&!temBpo())||bpoTenant()||(p==="master_rede"&&S.liberado)) ? 2 : 1;
  S.role = n>=2 ? "adm" : "ro";
  document.body.classList.remove("op"); document.body.classList.toggle("ro",S.role==="ro");
  setConn();
}
const isAdm = () => S.role==="adm";

async function resolverEmail(login){
  login=String(login||"").trim(); if(!login) throw new Error("Informe o CNPJ ou CPF.");
  if(login.includes("@")) return login;
  const d=digitos(login); if(d.length!==11&&d.length!==14) throw new Error("Digite um CNPJ (14 dígitos) ou um CPF (11 dígitos).");
  const r=await chamar("resolverLogin",{login:d}); return r.email;
}
const ERR_SB=[[/invalid login credentials/i,"Login ou senha incorretos."],[/banned/i,"Este acesso foi desativado."],[/rate limit|too many|security purposes/i,"Muitas tentativas. Aguarde alguns minutos e tente de novo."],[/should be different/i,"A nova senha precisa ser diferente da atual."],[/password should be at least|weak/i,"Senha fraca. Use pelo menos 8 caracteres com letras e números."],[/failed to fetch|network/i,"Sem conexão com a internet."],[/email not confirmed/i,"E-mail ainda não confirmado."]];
const ERR_AUTH={"auth/invalid-credential":"Login ou senha incorretos.","auth/wrong-password":"Login ou senha incorretos.","auth/user-not-found":"Login ou senha incorretos.","auth/invalid-email":"E-mail inválido.","auth/too-many-requests":"Muitas tentativas. Aguarde alguns minutos e tente de novo.","auth/user-disabled":"Este acesso foi desativado.","auth/network-request-failed":"Sem conexão com a internet.","auth/weak-password":"Senha fraca. Use pelo menos 8 caracteres com letras e números.","auth/requires-recent-login":"Por segurança, entre de novo antes de trocar a senha."};
const errAuth = e => { const m=(e&&e.message)||""; const x=ERR_SB.find(([r])=>r.test(m)); return x?x[1]:(ERR_AUTH[e&&e.code]||msgErro(e)); };
function telaLogin(msg){

const senhaFraca = s => s.length<8 || !/[A-Za-z]/.test(s) || !/\d/.test(s);

function valorCelula(v){ if(v==null||v==="") return 0; if(typeof v==="number") return Math.round(Math.abs(v)*100); const c=parseMoney(String(v)); return isFinite(c)?Math.abs(c):NaN; }
function lerPlanilha(wb){
  const X=window.XLSX; const cats=catsImportaveis(); const abas=[];
  const porId=id=>cats.find(c=>c.id===id)||(CAT_LEGADO[id]?cats.find(c=>c.id===CAT_LEGADO[id]):null);
  const porNome=n=>{ const t=normTxt(String(n||"").split(" — ")[0]); return t?cats.find(c=>normTxt(c.nome.split(" — ")[0])===t):null; };
  for(const nomeAba of wb.SheetNames){
    const rows=X.utils.sheet_to_json(wb.Sheets[nomeAba],{header:1,raw:true,defval:null,blankrows:true});
    let centroNome="",centroCod="",ano=null,hdr=-1,colCod=-1,colCat=-1; const colMes={};
    const prox=(row,i)=>{ for(let j=i+1;j<row.length;j++){ if(row[j]!=null&&String(row[j]).trim()!=="") return row[j]; } return null; };
    rows.forEach((row,ri)=>{ if(!row) return; row.forEach((cel,ci)=>{ const t=normTxt(String(cel??"")).replace(/[:\s]+$/,"");
      if(t==="centro de custo") centroNome=String(prox(row,ci)??"").trim();
      else if(t==="codigo interno") centroCod=String(prox(row,ci)??"").trim();
      else if(t==="ano"&&ano==null){ const v=parseInt(String(prox(row,ci)??"")); if(v>1990&&v<2200) ano=v; }
      else if(hdr<0&&t==="categoria"){ hdr=ri; colCat=ci; row.forEach((h,hi)=>{ const hn=normTxt(String(h??"")); if(hn==="codigo") colCod=hi; const m=MES_ABR.findIndex(a=>hn.startsWith(a)); if(m>=0&&colMes[m+1]==null) colMes[m+1]=hi; }); } }); });
    if(hdr<0||!Object.keys(colMes).length) continue;
    const itens=[], desconhecidas=[], invalidos=[];
    for(let ri=hdr+1;ri<rows.length;ri++){ const row=rows[ri]; if(!row) continue;
      const id=colCod>=0?String(row[colCod]??"").trim():""; const nome=row[colCat];
      const vals={}; let tem=false;
      for(const [m,ci] of Object.entries(colMes)){ const v=valorCelula(row[ci]); if(isNaN(v)) invalidos.push(`${nome||id} (${MESES_L[m-1]})`); else if(v>0){ vals[m]=v; tem=true; } }
      if(!tem) continue;
      const cat=(id&&porId(id))||porNome(nome);
      if(!cat){ if(!/^total|entradas|saidas|saídas/i.test(normTxt(String(nome||"")))) desconhecidas.push(String(nome||id)); continue; }
      for(const [m,v] of Object.entries(vals)) itens.push({cat,m:+m,v});
    }
    const ach = centros().find(c=>c.id===centroCod) || centros().find(c=>normTxt(c.nome)===normTxt(centroNome)) || centros().find(c=>normTxt(c.nome)===normTxt(nomeAba));
    abas.push({nomeAba,centroNome,centro:ach?ach.id:"",ano:ano||new Date().getFullYear(),itens,desconhecidas,invalidos});
  }
  return abas;
}

function vPlanoRede(){
  const base=catsBase(); const oficial=!!(S.planoRede&&Array.isArray(S.planoRede.categorias)&&S.planoRede.categorias.length);
  return header("Plano de contas da rede","Categorias padrão de todos os franqueados (🔒 = fixas: ninguém altera nem exclui). Você pode adicionar categorias à rede, e cada franqueado pode criar as próprias. Com o mesmo plano em toda a rede, o DRE e o painel ficam comparáveis.",`<button class="btn pri" data-act="pr-cat">+ Nova categoria base</button>`)
   + `<div class="banner info">${base.filter(x=>x.fixa).length} categorias fixas · ${base.filter(x=>!x.fixa).length} adicional(is) da rede${oficial&&S.planoRede.atualizado?` · última alteração em ${esc(dBR(S.planoRede.atualizado.slice(0,10)))} por ${esc(S.planoRede.atualizadoPor||"—")}`:""}. “Taxas de cartão” é calculada sozinha a partir de <b>Minhas taxas</b> de cada franqueado.</div>`
   + `<div class="grid g2e"><div class="panel">${GRUPOS.map(g=>{ const cs=base.filter(x=>x.grupo===g.id); return `<div class="flabel" style="margin-top:12px">${g.nome}</div><div class="list cfg-list">${cs.map(x=>`<div class="li"><span>${x.fixa?"🔒 ":'<span class="tag t-propria">adicional</span> '}${esc(x.nome)}${x.auto?' <span class="note">· calculada pelas taxas</span>':""}</span><span class="${x.tipo==="receita"?"tipo-r":"tipo-d"}" style="font-size:12px">${x.tipo}</span>${x.fixa?"<span></span>":`<button class="icon-btn" data-act="pr-cat" data-id="${esc(x.id)}">Editar</button>`}</div>`).join("")||'<div class="note">—</div>'}</div>`; }).join("")}</div>
     <div class="panel" style="align-self:start"><h2>Como funciona</h2><ol class="steps">
       <li>As categorias base aparecem para todos os franqueados, com cadeado.</li>

async function salvarPlano(lista,acao){
  const limpa=lista.filter(c=>!c.fixa).map(({id,nome,tipo,grupo})=>({id,nome,tipo,grupo}));
  const {error}=await FB.sb.from("rede_config").upsert({id:"plano",data:{categorias:limpa,atualizado:new Date().toISOString(),atualizadoPor:S.me.name}});
  if(error) throw sbErro(error); atualizarTabelas("rede_config");
  diarioRede("Plano de contas da rede alterado",acao);
}

    FB.sb.rpc("franq_definir_empresa",{p_tid:tid,p_empresa:emp||null,p_regional:reg||null}).then(({error})=>{ if(error){ toast(msgErro(error)); return; } atualizarTabelas("tenants"); toast("Empresa / regional atualizada"); }); return; }
  if(t.id==="dgCat"){ ui.dg=ui.dg||{}; ui.dg.cat=t.value; render(); return; }
  if(t.dataset&&t.dataset.vlanc){ if(S.role==="ro"){ toast("Somente leitura."); render(); return; } const l=S.lanc.find(x=>x.id===t.dataset.vlanc); const v=parseMoney(t.value); if(!l||!t.value.trim()) return; if(!(v>0)){ toast("Valor inválido — use números, ex.: 1.250,00"); return; } save("lanc",l.id,{...l,valor:v,valorPendente:false,atualizado:new Date().toISOString()}).then(()=>toast(`Valor de ${mlabel(compOf(l))} salvo: ${fmt(v)}`)).catch(()=>{}); return; }
  if($("#modalRoot").contains(t)||t.closest("#fMz")) return;
  if(t.id==="ccSel"){ ui.cc=t.value; saveUi(); render(); return; }
  const map={flMes:["l","mes"],ffIni:["f","ini"],fdIni:["d","ini"],fdFim:["d","fim"]};
  if(map[t.id]){ const [g,k]=map[t.id]; if((k==="ini"||k==="fim")&&!t.value) return; ui[g][k]=t.value; render(); }
});

iniciar();
})();
</script>
